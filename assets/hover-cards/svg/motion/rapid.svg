<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140" role="img" aria-label="Rapid positioning">
  <title>Rapid positioning</title>
  <defs>
    <style>
      .bg{fill:#0f172a} .panel{fill:#111827;stroke:#334155;stroke-width:1.5}
      .metal{fill:#94a3b8} .metal2{fill:#cbd5e1} .line{fill:none;stroke:#22d3ee;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .accent{fill:none;stroke:#14b8a6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .warn{fill:none;stroke:#f59e0b;stroke-width:2.5;stroke-dasharray:5 4}
      .dim{fill:none;stroke:#60a5fa;stroke-width:2} .thin{fill:none;stroke:#64748b;stroke-width:1.5}
      .txt{font: 11px ui-sans-serif,system-ui;fill:#e5e7eb} .small{font:9px ui-sans-serif,system-ui;fill:#cbd5e1}
      .chip{fill:#1d4ed8} .green{stroke:#22c55e} .red{stroke:#ef4444}
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#22d3ee"/></marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#14b8a6"/></marker>
  </defs>
  <rect class="bg" width="240" height="140" rx="12"/>
  
<rect class="panel" x="18" y="88" width="204" height="26" rx="4"/>
<rect class="metal2" x="28" y="94" width="48" height="14" rx="2"/>
<path class="line" d="M46 76 L46 44 L176 44" marker-end="url(#a)"/>
<circle cx="46" cy="76" r="5" fill="#22d3ee"/><circle cx="176" cy="44" r="5" fill="#14b8a6"/>
<text class="txt" x="18" y="24">RAPID POSITION</text><text class="small" x="92" y="65">fast non-cutting move</text>

</svg>