<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140" role="img" aria-label="Clockwise arc">
  <title>Clockwise arc</title>
  <defs>
    <style>
      .bg{fill:#0f172a} .panel{fill:#111827;stroke:#334155;stroke-width:1.5}
      .metal{fill:#94a3b8} .metal2{fill:#cbd5e1} .line{fill:none;stroke:#22d3ee;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .accent{fill:none;stroke:#14b8a6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .warn{fill:none;stroke:#f59e0b;stroke-width:2.5;stroke-dasharray:5 4}
