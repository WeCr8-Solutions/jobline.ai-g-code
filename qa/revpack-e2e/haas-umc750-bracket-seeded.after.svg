<text x="40" y="734" fill="#ff5d5d" font-size="22" font-weight="700">FAIL: 10 errors, 0 warnings · tools T1 T2 T4 · offsets G54 G55</text>
<text x="40" y="762" fill="#9fb3c8" font-size="14">travel ✗1 (85)   collision ✗3 (4281)   offsets ✗1 (2)   tools ✗2 (17)   spindle-feed ✗1 (6)   tool-change ✗1 (3)   five-axis ✗1 (3)   dialect ✓ (1)   program ✓ (2)</text>
<text x="40" y="788" fill="#ff8787" font-size="14">L7 undefined-work-offset-G55: G55 is selected but the RevPack defines only G54.</text>
<text x="40" y="809" fill="#ff8787" font-size="14">L14 rapid-into-stock: Rapid takes T1 to Z-0.5000 where uncut stock stands at Z-0.0500.</text>
<text x="40" y="830" fill="#ff8787" font-size="14">L15 rapid-into-stock: Rapid takes T1 to Z-0.5000 where uncut stock stands at Z0.0000.</text>
<text x="40" y="851" fill="#ff8787" font-size="14">L16 unsafe-tool-change: M06 with the spindle at machine Z-13.6500; retract to Z0 (G28 G91 Z0 or G53 Z0) first.</text>
<text x="40" y="872" fill="#ff8787" font-size="14">L18 tool-length-mismatch-T2: T2 is in the spindle but the program applies H1 (T1's length); expected H2.</text>
<text x="40" y="893" fill="#ff8787" font-size="14">L20 simultaneous-5x-without-tcpc: Simultaneous rotary + linear feed without TCPC (G234) active: the tool tip will not follow the programmed path.</text>
<text x="40" y="914" fill="#ff8787" font-size="14">L24 tool-not-in-revpack-T4: T4 is called but the RevPack tool list has T1, T2, T3.</text>
<text x="40" y="935" fill="#ff8787" font-size="14">L25 over-travel-B: B goes to -40°; Haas UMC-750 (NGC) allows -35° to 120°.</text>
<text x="40" y="956" fill="#ff8787" font-size="14">L26 rpm-over-machine: S9000 exceeds Haas UMC-750 (NGC)'s 8100 rpm.</text>
