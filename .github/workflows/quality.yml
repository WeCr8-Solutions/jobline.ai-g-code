name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  parser-review-and-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run test:all
      - run: npm run review:fixtures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-review
          path: test-results/fixture-review

  vscode-visual-matrix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-matrix
          path: test-results/visual
