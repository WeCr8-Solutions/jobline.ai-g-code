<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<style>
  :root {
    --bg: var(--vscode-sideBar-background, #252526);
    --fg: var(--vscode-foreground, #cccccc);
    --btn-bg: var(--vscode-button-background, #0e639c);
    --btn-fg: var(--vscode-button-foreground, #ffffff);
    --btn-hover: var(--vscode-button-hoverBackground, #1177bb);
    --btn2-bg: transparent;
    --btn2-border: var(--vscode-widget-border, #454545);
    --btn2-hover: var(--vscode-sideBarSectionHeader-background, #2d2d2d);
    --input-bg: var(--vscode-input-background, #3c3c3c);
    --input-fg: var(--vscode-input-foreground, #cccccc);
    --input-border: var(--vscode-input-border, #3c3c3c);
    --sec-bg: var(--vscode-sideBarSectionHeader-background, #2d2d2d);
    --sec-fg: var(--vscode-sideBarSectionHeader-foreground, #bbb);
    --border: var(--vscode-widget-border, #454545);
    --hint-fg: var(--vscode-descriptionForeground, #999);
    --font: var(--vscode-font-family, sans-serif);
    --fs: var(--vscode-font-size, 13px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: var(--fs); }
  .sec-hdr {
    background: var(--sec-bg); color: var(--sec-fg);
    font-size: 0.78em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 5px 8px; border-top: 1px solid var(--border); user-select: none;
  }
  .sec { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row label { font-size: 0.82em; min-width: 5.5em; color: var(--hint-fg); }
  input[type=number] {
    background: var(--input-bg); color: var(--input-fg);
    border: 1px solid var(--input-border); border-radius: 3px;
    padding: 3px 5px; flex: 1;
    font-size: var(--fs); font-family: var(--font);
  }
  input[type=color] {
    width: 32px; height: 28px; border: 1px solid var(--border);
    background: var(--input-bg); cursor: pointer; border-radius: 3px;
  }
  button {
    background: var(--btn-bg); color: var(--btn-fg);
    border: none; border-radius: 3px; padding: 5px 10px;
    cursor: pointer; font-size: var(--fs); font-family: var(--font);
    width: 100%; text-align: left;
  }
  button:hover { background: var(--btn-hover); }
  button.sec { background: var(--btn2-bg); color: var(--fg); border: 1px solid var(--btn2-border); text-align: center; }
  button.sec:hover { background: var(--btn2-hover); }
  button.sec.active {
    background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg);
  }
  .unit-row { display: flex; gap: 4px; }
  .unit-row button { flex: 1; text-align: center; }
</style>
</head>
<body>
<div class="sec-hdr">Launch</div>
<div class="sec">
  <button onclick="launchToolPreview()">🔧 Tools Preview</button>
  <button onclick="launchSimulation()">▶ Open Simulation</button>
</div>
<div class="sec-hdr">Machine</div>
<div class="sec">
  <select id="machineType" onchange="changeMachine()">
    <option>3-Axis Vertical Mill</option>
    <option>4-Axis Mill</option>
    <option>5-Axis Mill (Trunnion)</option>
    <option>5-Axis Mill (Rotary Table)</option>
    <option>Turn Center (2-Axis)</option>
    <option>5-Axis Mill-Turn</option>
    <option>Multi-Spindle Transfer</option>
    <option>Grinding Center</option>
  </select>
  <div style="font-size: 0.75em; color: var(--hint-fg); margin-top: 4px;">
    <label style="display: flex; align-items: center; gap: 4px;">
      <input type="checkbox" id="capLiveTool" onchange="updateCaps()"> Live Tool
    </label>
    <label style="display: flex; align-items: center; gap: 4px;">
      <input type="checkbox" id="capProbing" onchange="updateCaps()"> Probing
    </label>
    <label style="display: flex; align-items: center; gap: 4px;">
      <input type="checkbox" id="cap4thAxis" onchange="updateCaps()"> 4th Axis
    </label>
    <label style="display: flex; align-items: center; gap: 4px;">
      <input type="checkbox" id="cap5thAxis" onchange="updateCaps()"> 5th Axis
    </label>
  </div>
</div>
<div class="sec-hdr">Visualizer</div>
<div class="sec">
  <button onclick="openViz()">👁️ Open 3D Visualizer</button>
</div>
<div class="sec-hdr">Stock Dimensions</div>
<div class="sec">
  <div class="unit-row">
    <button class="sec active" id="unitIn" onclick="setUnit('in')">Inches (in)</button>
    <button class="sec" id="unitMm" onclick="setUnit('mm')">Metric (mm)</button>
  </div>
  <div class="row"><label>Width (X)</label><input type="number" id="stockW" value="4" step="0.001" min="0.001"></div>
  <div class="row"><label>Depth (Y)</label><input type="number" id="stockD" value="4" step="0.001" min="0.001"></div>
  <div class="row"><label>Height (Z)</label><input type="number" id="stockH" value="2" step="0.001" min="0.001"></div>
  <div class="row">
    <label>Color</label>
    <input type="color" id="stockColor" value="#4488ff">
  </div>
  <button onclick="applyStock()">Apply to Visualizer</button>
</div>
<div class="sec-hdr">Global Coordinate System (GCS)</div>
<div class="sec">
  <div class="row"><label>X</label><input type="number" id="gcsX" value="0" step="0.001"></div>
  <div class="row"><label>Y</label><input type="number" id="gcsY" value="0" step="0.001"></div>
  <div class="row"><label>Z</label><input type="number" id="gcsZ" value="0" step="0.001"></div>
  <button onclick="applyGCS()" style="margin-top:6px;">Set GCS Origin</button>
</div>

<div class="sec-hdr">Work Coordinate Systems (WCS)</div>
<div class="sec" id="wcsSection">
  <div id="wcsList"></div>
  <button onclick="addWCS()" style="margin-top:6px;">Add WCS Layer</button>
</div>

<div class="sec-hdr">Stock Origin (WCS Zero)</div>
<div class="sec">
  <div class="row">
    <label>Preset</label>
    <select id="originPreset" onchange="onOriginPresetChange()" style="flex:1; background:var(--input-bg); color:var(--input-fg); border:1px solid var(--input-border); border-radius:3px; padding:3px 5px; font-size:var(--fs);">
      <option value="cornerFL">Corner (X0 Y0 at front-left)</option>
      <option value="centerTop">Center top</option>
      <option value="centerBottom">Center bottom</option>
      <option value="custom">Custom</option>
    </select>
  </div>
  <div id="originCustom" style="display:none;">
    <div class="row"><label>X offset</label><input type="number" id="originX" value="0" step="0.001"></div>
    <div class="row"><label>Y offset</label><input type="number" id="originY" value="0" step="0.001"></div>
    <div class="row"><label>Z offset</label><input type="number" id="originZ" value="0" step="0.001"></div>
  </div>
  <button onclick="applyOrigin()" style="margin-top:6px;">Apply Origin</button>
</div>
<div class="sec-hdr">Layer Filters</div>
<div class="sec">
  <label style="font-size:0.82em; display:flex; gap:4px; align-items:center;"><input type="checkbox" id="cbTool" checked onchange="toggleLayer('tool')"> Tool</label>
  <label style="font-size:0.82em; display:flex; gap:4px; align-items:center;"><input type="checkbox" id="cbToolHolder" checked onchange="toggleLayer('toolHolder')"> Tool Holder</label>
  <label style="font-size:0.82em; display:flex; gap:4px; align-items:center;"><input type="checkbox" id="cbStock" checked onchange="toggleLayer('stock')"> Stock</label>
  <label style="font-size:0.82em; display:flex; gap:4px; align-items:center;"><input type="checkbox" id="cbPath" checked onchange="toggleLayer('path')"> Toolpath</label>
  <label style="font-size:0.82em; display:flex; gap:4px; align-items:center;"><input type="checkbox" id="cbSweptTube" checked onchange="toggleLayer('sweptTube')"> Swept Tube</label>
  <label style="font-size:0.82em; display:flex; gap:4px; align-items:center;"><input type="checkbox" id="cbOrigin" checked onchange="toggleLayer('origin')"> Origin Marker</label>
</div>
<script>
  const vs = acquireVsCodeApi();
  let currentUnit = 'in';
  // GCS
  function applyGCS() {
    const x = parseFloat(document.getElementById('gcsX').value) || 0;
    const y = parseFloat(document.getElementById('gcsY').value) || 0;
    const z = parseFloat(document.getElementById('gcsZ').value) || 0;
    vs.postMessage({ type: 'gcsUpdate', x, y, z });
  }
  // WCS
  let wcsLayers = [
    { name: 'G54', x: 0, y: 0, z: 0 },
    { name: 'G55', x: 0, y: 0, z: 0 }
  ];
  let activeWCS = 0;
  function renderWCSList() {
    const list = document.getElementById('wcsList');
    list.innerHTML = '';
    wcsLayers.forEach((wcs, idx) => {
      const div = document.createElement('div');
      div.style.display = 'flex';
      div.style.alignItems = 'center';
      div.style.gap = '6px';
      div.style.marginBottom = '4px';
      div.innerHTML = [
        '<input type="radio" name="wcsActive" ' + (activeWCS === idx ? 'checked' : '') + ' onchange="setActiveWCS(' + idx + ')">',
        '<input type="text" value="' + wcs.name + '" style="width:3em;" onchange="renameWCS(' + idx + ', this.value)">',
        'X:<input type="number" value="' + wcs.x + '" style="width:4em;" onchange="editWCS(' + idx + ', \'x\', this.value)">',
        'Y:<input type="number" value="' + wcs.y + '" style="width:4em;" onchange="editWCS(' + idx + ', \'y\', this.value)">',
        'Z:<input type="number" value="' + wcs.z + '" style="width:4em;" onchange="editWCS(' + idx + ', \'z\', this.value)">',
        '<button onclick="removeWCS(' + idx + ')" style="width:2em;">✕</button>'
      ].join(' ');
      list.appendChild(div);
    });
  }
  function addWCS() {
    wcsLayers.push({ name: 'G' + (54 + wcsLayers.length), x: 0, y: 0, z: 0 });
    renderWCSList();
  }
  function removeWCS(idx) {
    wcsLayers.splice(idx, 1);
    if (activeWCS >= wcsLayers.length) activeWCS = wcsLayers.length - 1;
    renderWCSList();
  }
  function setActiveWCS(idx) {
    activeWCS = idx;
    renderWCSList();
    vs.postMessage({ type: 'wcsActive', idx, wcs: wcsLayers[idx] });
  }
  function renameWCS(idx, val) {
    wcsLayers[idx].name = val;
    renderWCSList();
  }
  function editWCS(idx, axis, val) {
    wcsLayers[idx][axis] = parseFloat(val) || 0;
    renderWCSList();
    vs.postMessage({ type: 'wcsUpdate', idx, wcs: wcsLayers[idx] });
  }
  window.addWCS = addWCS;
  window.removeWCS = removeWCS;
  window.setActiveWCS = setActiveWCS;
  window.renameWCS = renameWCS;
  window.editWCS = editWCS;
  window.onload = renderWCSList;
  // ...existing code for launchToolPreview, launchSimulation, changeMachine, updateCaps, openViz, setUnit, applyStock, onOriginPresetChange, applyOrigin, toggleLayer...
  function launchToolPreview() { vs.postMessage({ command: 'jobline.openToolPreview' }); }
  function launchSimulation() { vs.postMessage({ command: 'jobline.openSimulation' }); }
  function changeMachine() { const machine = document.getElementById('machineType').value; vs.postMessage({ type: 'machineType', value: machine }); }
  function updateCaps() { const caps = { liveTool: document.getElementById('capLiveTool').checked, probing: document.getElementById('capProbing').checked, fourthAxis: document.getElementById('cap4thAxis').checked, fifthAxis: document.getElementById('cap5thAxis').checked, }; vs.postMessage({ type: 'machineCapabilities', value: caps }); }
  function openViz() { vs.postMessage({ command: 'jobline.gcode.showVisualizer' }); }
  function setUnit(unit) { currentUnit = unit; document.getElementById('unitIn').classList.toggle('active', unit === 'in'); document.getElementById('unitMm').classList.toggle('active', unit === 'mm'); }
  function applyStock() { const w = parseFloat(document.getElementById('stockW').value) || 4; const d = parseFloat(document.getElementById('stockD').value) || 4; const h = parseFloat(document.getElementById('stockH').value) || 2; const color = document.getElementById('stockColor').value; vs.postMessage({ type: 'stockSettings', w, d, h, unit: currentUnit, color }); }
  function onOriginPresetChange() { const preset = document.getElementById('originPreset').value; document.getElementById('originCustom').style.display = preset === 'custom' ? 'block' : 'none'; }
  function applyOrigin() { const preset = document.getElementById('originPreset').value; const w = parseFloat(document.getElementById('stockW').value) || 4; const d = parseFloat(document.getElementById('stockD').value) || 4; const h = parseFloat(document.getElementById('stockH').value) || 2; let xOff = 0, yOff = 0, zOff = 0; if (preset === 'cornerFL') { xOff = w / 2; yOff = d / 2; zOff = 0; } else if (preset === 'centerTop') { xOff = 0; yOff = 0; zOff = 0; } else if (preset === 'centerBottom') { xOff = 0; yOff = 0; zOff = -h; } else { xOff = parseFloat(document.getElementById('originX').value) || 0; yOff = parseFloat(document.getElementById('originY').value) || 0; zOff = parseFloat(document.getElementById('originZ').value) || 0; } vs.postMessage({ type: 'stockOrigin', preset, xOff, yOff, zOff }); }
  function toggleLayer(layer) { const checked = document.getElementById('cb' + layer.charAt(0).toUpperCase() + layer.slice(1)).checked; vs.postMessage({ type: 'layerToggle', layer, visible: checked }); }
</script>
</body>
</html>
